---
# Counts pending Windows updates and (approximately) outdated winget apps.
# Writes one JSON file per host to logs/inventory/<host>.json. Read-only.
# Run:  ansible-playbook playbooks/inventory-check.yml
- name: Inventory check
  hosts: "{{ target | default('windows') }}"
  gather_facts: false
  tasks:
    - name: Make sure output folders exist
      ansible.builtin.file:
        path: "{{ log_dir }}/inventory"
        state: directory
        mode: "0755"
      delegate_to: localhost
      run_once: true

    - name: Count pending Windows updates
      ansible.windows.win_updates:
        category_names: "{{ update_categories }}"
        state: searched
      register: scan

    # Approximate: parses the "N upgrades available" line winget prints.
    - name: Count outdated winget apps
      ansible.windows.win_shell: |
        $text = (winget upgrade --accept-source-agreements --disable-interactivity 2>&1 | Out-String)
        if ($text -match '(\d+)\s+upgrades?\s+available') { $matches[1] } else { 0 }
      register: wg
      changed_when: false
      failed_when: false

    - name: Save result
      ansible.builtin.copy:
        content: "{{ {'host': inventory_hostname, 'checked': now().strftime('%Y-%m-%d %H:%M:%S'), 'pending_updates': scan.found_update_count | default(0), 'outdated_software': (wg.stdout | default('0') | trim | int(0))} | to_nice_json }}"
        dest: "{{ log_dir }}/inventory/{{ inventory_hostname }}.json"
        mode: "0644"
      delegate_to: localhost
